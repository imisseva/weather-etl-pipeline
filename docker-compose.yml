
# ============================================================================
# Weather ETL Pipeline — Apache Airflow (LocalExecutor)
# ============================================================================
#
# KHOI DONG LAN DAU (bat buoc):
#   docker compose up airflow-init
#   docker compose up -d
#
# TRUY CAP AIRFLOW UI:
#   http://localhost:8080  (admin / admin)
#
# TRIGGER PIPELINE THU CONG (khong can doi schedule):
#   docker compose exec airflow-scheduler airflow dags trigger weather_etl_pipeline
#
# KIEM TRA LOG:
#   docker compose logs -f airflow-scheduler
#
# DON DEP:
#   docker compose down -v --remove-orphans
# ============================================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: weather-etl-airflow:latest
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: 'weather-etl-secret-key-change-in-prod'
    TZ: Asia/Ho_Chi_Minh
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./main.py:/opt/airflow/main.py
    - ./logs/airflow:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy
  networks:
    - weather-network

services:
  # ──────────────────────────────────────────
  # AIRFLOW METADATA DATABASE
  # ──────────────────────────────────────────
  airflow-postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weather-network

  # ──────────────────────────────────────────
  # AIRFLOW INIT (chay 1 lan de khoi tao DB + tao user admin)
  # ──────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Weather --lastname ETL --role Admin --email admin@example.com"
    restart: "no"

  # ──────────────────────────────────────────
  # AIRFLOW WEBSERVER (UI tai localhost:8080)
  # ──────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ──────────────────────────────────────────
  # AIRFLOW SCHEDULER (doc DAG, kich hoat task theo schedule)
  # ──────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# ============================================================================
# VOLUMES & NETWORKS
# ============================================================================
volumes:
  airflow-postgres-data:
    driver: local

networks:
  weather-network:
    name: weather-network
    driver: bridge
