name: Weather ETL Pipeline

on:
  schedule:
    # Chạy hàng ngày lúc 02:00 sáng theo giờ Việt Nam (UTC+7) = 19:00 UTC ngày hôm trước
    - cron: '0 19 * * *'
  workflow_dispatch: # Cho phép kích hoạt chạy bằng tay từ giao diện GitHub Actions tab

jobs:
  run-etl-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weather ETL Pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          OPEN_METEO_URL: ${{ secrets.OPEN_METEO_URL }}
        run: |
          python main.py
